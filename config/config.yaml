artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  local_data_file: data/raw/ai4i+2020+predictive+maintenance+dataset.zip
  unzip_dir: artifacts/data_ingestion
  ingested_data_file: artifacts/data_ingestion/raw_data.csv
  
data_validation:
  root_dir: artifacts/data_validation
  status_file: artifacts/data_validation/status.txt
  schema_file: config/schema.yaml
  data_file: artifacts/data_ingestion/raw_data.csv

data_preprocessing:
  root_dir: artifacts/data_preprocessing
  input_data_file: artifacts/data_ingestion/raw_data.csv
  train_data_file: artifacts/data_preprocessing/train.csv
  test_data_file: artifacts/data_preprocessing/test.csv
  preprocessor_file: artifacts/data_preprocessing/preprocessor.pkl

feature_engineering:
  root_dir: artifacts/feature_engineering

  input_train_data_file: artifacts/data_preprocessing/train.csv
  input_test_data_file: artifacts/data_preprocessing/test.csv

  output_train_data_file: artifacts/feature_engineering/train.csv
  output_test_data_file: artifacts/feature_engineering/test.csv

model_training:
  root_dir: artifacts/model_training
  input_train_data_file: artifacts/feature_engineering/train.csv
  input_test_data_file: artifacts/feature_engineering/test.csv  
  trained_model_path: artifacts/model_training/model.pkl
  target_column: Machine failure

model_evaluation:
  root_dir: artifacts/model_evaluation
  model_path: artifacts/model_training/model.pkl
  test_data_path: artifacts/feature_engineering/test.csv
  target_column: Machine failure
  metrics_file: artifacts/model_evaluation/metrics.json
  confusion_matrix_path: artifacts/model_evaluation/confusion_matrix.png
  
model_registry:
  root_dir: artifacts/model_registry
  registry_dir: artifacts/model_registry/versions
  model_path: artifacts/model_training/model.pkl
  metrics_path: artifacts/model_evaluation/metrics.json

prediction:
  root_dir: artifacts/prediction
  model_path: artifacts/model_registry/latest_model.pkl
  raw_data_file: artifacts/data_ingestion/raw_data.csv

anomaly_detection:
  root_dir: artifacts/anomaly_detection
  data_file: artifacts/data_ingestion/raw_data.csv
  model_path: artifacts/anomaly_detection/anomaly_model.pkl


explainability:
  root_dir: artifacts/explainability
  model_path: artifacts/model_registry/latest_model.pkl